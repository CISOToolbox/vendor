<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor - CISO Toolbox</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/cisotoolbox.css">
<link rel="stylesheet" href="css/tprm.css">
</head>
<body class="ct-app-shell">

<div class="ct-app">
<header class="ct-appbar">
    <button class="btn-hamburger" data-click="_toggleSidebarMobile">&#9776;</button>
    <span class="ct-modulepicker" role="img" aria-label="Vendor"><span data-i18n="module.vendor">Vendor</span></span>
    <span class="ct-appbar-sep"></span>
    <nav class="ct-appbar-context" aria-label="Context" data-i18n-aria-label="chrome.context"><span class="ct-muted" id="header-subtitle"></span></nav>
    <div class="toolbar-menu">
        <button class="ct-btn" data-size="sm" data-click="toggleMenu"><span data-i18n="menu_file">File</span></button>
        <div class="toolbar-dropdown" id="io-menu">
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["openFile"]' data-i18n="menu_open">Open</div>
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["saveJSON"]' data-i18n="menu_save_as">Save as</div>
            <div class="toolbar-dropdown-sep"></div>
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["doraOpenExportModal"]' data-i18n="menu_dora_export">DORA RoI export</div>
        </div>
    </div>
    <span class="ct-spacer"></span>
    <span class="ct-appbar-saved" id="status-msg"></span>
    <div class="ct-appbar-actions">
        <button class="ct-iconaction" data-click="ct_toggleLang" data-icon="globe" aria-label="Language" data-i18n-aria-label="chrome.lang" title="Language FR / EN" data-i18n-title="chrome.lang_toggle"></button>
        <button class="ct-iconaction" data-click="ct_toggleTheme" data-icon="moon" aria-label="Theme" data-i18n-aria-label="chrome.theme" title="Light / dark theme" data-i18n-title="chrome.theme_toggle"></button>
        <span class="ct-toolbar-right" id="toolbar-right"></span>
    </div>
</header>

<div class="ct-body">

<nav class="ct-rail" id="sidebar" aria-label="Module navigation" data-i18n-aria-label="chrome.nav">
  <div class="ct-rail-scroll">
    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span>TPRM</span>
      </button>
      <button class="ct-rail-item" aria-current="page" data-click="selectPanel" data-args='["dashboard"]'><span class="ct-rail-item-label" data-i18n="nav.dashboard">Dashboard</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["vendors"]'><span class="ct-rail-item-label" data-i18n="nav.vendors">Vendors</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["risks"]'><span class="ct-rail-item-label" data-i18n="nav.risks">Risks</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["measures"]'><span class="ct-rail-item-label" data-i18n="nav.measures">Mitigations</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["documents"]'><span class="ct-rail-item-label" data-i18n="nav.documents">Documents</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["nonconformities"]'><span class="ct-rail-item-label" data-i18n="nav.nonconformities">Non-conformities</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["templates"]'><span class="ct-rail-item-label" data-i18n="nav.templates">Assessment templates</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["dora"]'><span class="ct-rail-item-label" data-i18n="nav.dora">DORA Register</span></button>
    </div>

    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span data-i18n="tprm.sidebar.section_aide">Help</span>
      </button>
      <button class="ct-rail-item" data-click="toggleHelp" data-args='["methodo"]'><span class="ct-rail-item-label" data-i18n="tprm.sidebar.methodo">Methodology</span></button>
      <button class="ct-rail-item" data-click="toggleHelp" data-args='["usage"]'><span class="ct-rail-item-label" data-i18n="tprm.sidebar.usage">How to use</span></button>
    </div>
  </div>

  <div class="ct-rail-foot">
    <a href="https://www.cisotoolbox.org" target="_blank" rel="noopener noreferrer" class="sidebar-brand">cisotoolbox.org</a>
  </div>
</nav>

<main class="ct-content" id="content"></main>
</div><!-- ct-body -->
</div><!-- ct-app -->

<input type="file" id="file-input" accept=".json,.enc" class="ct-hidden" data-change="loadJSON" data-pass-event>

<!-- Help panel -->
<div class="help-overlay" id="help-overlay" data-click-self="toggleHelp">
<div class="help-panel">
<button class="close-help" data-click="toggleHelp">&times;</button>

<div class="help-tabs">
    <div class="help-tab active" id="help-tab-methodo" data-click="switchHelpTab" data-args='["methodo"]' data-i18n="tprm.help.tab_methodo">TPRM Methodology</div>
    <div class="help-tab" id="help-tab-usage" data-click="switchHelpTab" data-args='["usage"]' data-i18n="tprm.help.tab_usage">How to use the application</div>
    <div class="help-tab" id="help-tab-dora" data-click="switchHelpTab" data-args='["dora"]' data-i18n="tprm.help.tab_dora">DORA Register (RoI)</div>
</div>

<!-- Methodology tab -->
<div class="help-content" id="help-content-methodo" data-i18n-html="tprm.help.methodo"></div>

<!-- Usage tab -->
<div class="help-content ct-hidden" id="help-content-usage" data-i18n-html="tprm.help.usage"></div>
<div class="help-content ct-hidden" id="help-content-dora" data-i18n-html="tprm.help.dora"></div>

</div>
</div>

<div class="ct-pwd-overlay" id="confirm-overlay">
<div class="ct-pwd-panel">
    <div class="ct-pwd-title" id="confirm-title"></div>
    <div id="confirm-body" class="ct-text-data ct-mb-3"></div>
    <div class="ct-flex ct-gap-2 ct-justify-end">
        <button class="ct-btn" id="confirm-non" data-i18n="btn_no">No</button>
        <button class="ct-btn" data-variant="primary" id="confirm-oui" data-i18n="btn_yes">Yes</button>
    </div>
</div>
</div>

<div class="ct-pwd-overlay" id="pwd-overlay">
<div class="ct-pwd-panel">
    <div class="ct-pwd-title" id="pwd-title"></div>
    <input type="password" class="ct-pwd-input" id="pwd-input" placeholder="Password" data-i18n-placeholder="pwd_placeholder" autocomplete="off">
    <input type="password" class="ct-pwd-input hidden" id="pwd-input2" placeholder="Confirm password" data-i18n-placeholder="pwd_confirm_placeholder" autocomplete="off">
    <div class="ct-pwd-error" id="pwd-error"></div>
    <div class="ct-flex ct-gap-2 ct-justify-end ct-mt-2">
        <button class="ct-btn" id="pwd-cancel" data-i18n="btn_cancel">Cancel</button>
        <button class="ct-btn" data-variant="primary" id="pwd-ok" data-i18n="btn_ok">OK</button>
    </div>
</div>
</div>

<script src="js/ct_schema.js"></script>
<script src="js/cisotoolbox.js"></script>
<script src="js/TPRM_handlers.js"></script>
<script src="js/ct_modules.js"></script>
<script src="js/cisotoolbox_backend.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n_core_en.js"></script>
<script src="js/i18n_core_fr.js"></script>
<script src="js/TPRM_i18n_fr.js"></script>
<script src="js/TPRM_i18n_en.js"></script>
<script src="js/dora_codelists_i18n.js"></script>
<script src="js/TPRM_questions.js"></script>
<script src="js/ct_refselect.js"></script>
<script src="js/ct_modal.js"></script>
<script src="js/ct_datepicker.js"></script>
<script src="js/ct_userpicker.js"></script>
<script src="js/ct_measure_modal.js"></script>
<script src="js/ct_nonconformity.js"></script>
<script src="js/ct_table.js"></script>
<script src="js/ct_bulkbar.js"></script>
<script src="js/vendor_api.js"></script>
<script src="js/TPRM_dora.js"></script>
<script src="js/directory_picker.js"></script>
<script src="js/TPRM_app.js"></script>
<script src="js/ai_common.js"></script>
<script src="js/ct_settings.js"></script>
<script src="js/ai_backend.js"></script>
<script src="js/ct_proxy_settings.js"></script>
<script src="js/ct_users_settings.js"></script>

</body>
</html>
